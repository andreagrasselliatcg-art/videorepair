name: Build VideoRepair installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Scegli Xcode 16 (supporta macOS 11)
        run: |
          X=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Versione
        run: echo "VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Cache ffmpeg
        id: ffcache
        uses: actions/cache@v4
        with:
          path: vendor/bin
          key: ffmpeg-bigsur-x86_64-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Compila ffmpeg per macOS 11
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: bash scripts/ci-run.sh bash scripts/build-ffmpeg.sh vendor/bin

      - name: Compila app Universal
        run: FFMPEG_DIR=vendor/bin bash scripts/ci-run.sh bash build.sh

      - name: Crea installer .pkg
        run: bash scripts/ci-run.sh bash scripts/make-pkg.sh

      - name: Controlli
        run: |
          lipo -info build/VideoRepair.app/Contents/MacOS/VideoRepair
          otool -l build/VideoRepair.app/Contents/MacOS/VideoRepair | grep -A4 LC_BUILD_VERSION | grep minos
          pkgutil --payload-files "build/VideoRepair-$VERSION.pkg" | head -20
          build/VideoRepair.app/Contents/Resources/bin/ffmpeg -hide_banner -version | head -1 || echo 'Rosetta non disponibile, salto test'

      - uses: actions/upload-artifact@v4
        with:
          name: VideoRepair-${{ env.VERSION }}
          path: build/VideoRepair-*.pkg

      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: VideoRepair ${{ env.VERSION }}
          files: build/VideoRepair-*.pkg
          body: |
            Scarica **VideoRepair-${{ env.VERSION }}.pkg** e aprilo per installare.
            Compatibile con macOS 11 Big Sur o successivo, Intel e Apple Silicon. ffmpeg incluso.
            Se macOS dice "sviluppatore non identificato": tasto destro sul .pkg > Apri > Apri.
